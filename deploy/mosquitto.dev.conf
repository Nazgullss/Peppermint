# Local development broker.
#
# Bound to the loopback interface only, so it is unreachable from the network even
# though it accepts anonymous clients. The production config keeps the same
# loopback-only binding but requires a password, because on the deployed box the
# broker sits behind the backend rather than in front of it.

listener 1883 127.0.0.1
allow_anonymous true

# Telemetry is a firehose of small QoS 0 messages; there is nothing worth persisting
# across a restart, and writing a DB file would only add I/O to the hot path.
persistence false

log_type warning
log_type error
log_dest stdout

# One publisher process stands in for the whole fleet, so a single client can be
# responsible for thousands of messages a second. The defaults throttle that.
max_queued_messages 0
max_inflight_messages 0
