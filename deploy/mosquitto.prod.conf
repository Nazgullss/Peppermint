# Production broker, installed to /etc/mosquitto/conf.d/fleet.conf
#
# Ubuntu's mosquitto.conf ends with `include_dir /etc/mosquitto/conf.d`, so everything
# here is read after the package defaults and overrides them.
#
# Same loopback-only binding as mosquitto.dev.conf, but anonymous access is off. On the
# deployed box the broker sits *behind* the backend: the only way to reach the fleet from
# outside is POST /api/admin/config, which authenticates first. Binding to 127.0.0.1
# means that is not a policy but a fact -- port 1883 is not reachable from the network
# even if the security group were opened by mistake.

listener 1883 127.0.0.1
allow_anonymous false
password_file /etc/mosquitto/passwd

# Telemetry is a firehose of small QoS 0 messages; there is nothing worth persisting
# across a restart, and writing a DB file would only add I/O to the hot path. This
# overrides the `persistence true` in the packaged default.
persistence false

# One publisher process stands in for the whole fleet, so a single client is responsible
# for thousands of messages a second. The defaults throttle exactly that: without these
# the broker silently caps the load test rather than the system doing so honestly.
max_queued_messages 0
max_inflight_messages 0

# The load test opens one publisher and one subscriber, but keep headroom for the
# mosquitto_sub sessions used to watch topics by hand while measuring.
max_connections -1

log_type warning
log_type error

# Deliberately no `log_dest` here. mosquitto's log destinations are additive, not
# overriding, so setting one would duplicate every line into the packaged
# /var/log/mosquitto/mosquitto.log as well. Read that file, or `journalctl -u mosquitto`.
